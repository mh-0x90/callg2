<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Receipt | QuickCart</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <main class="shell">
    <p class="eyebrow">QuickCart</p>
    <h1>Receipt preferences</h1>
    <p>Choose how your receipt should look and add an optional note.</p>

    <form method="post" class="lab-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="message">Receipt note</label>
      <textarea id="message" name="message" maxlength="200" rows="4">{{ message }}</textarea>

      <label for="style">Receipt style</label>
      <select id="style" name="style">
        <option value="standard" {% if style == "standard" %}selected{% endif %}>Standard</option>
        <option value="compact" {% if style == "compact" %}selected{% endif %}>Compact</option>
      </select>

      <button type="submit">Create receipt</button>
    </form>

    <p><a href="{{ url_for('home') }}">Back to shop</a></p>
  </main>
</body>
</html>
