<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong | QuickCart</title>

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='styles.css') }}"
  >
</head>

<body>
  <main class="shell">
    <p class="eyebrow">QuickCart</p>

    <h1>Something went wrong</h1>

    <p>
      QuickCart could not complete your request.
    </p>

    {% if last_error %}
      <section class="audit-error">
        <h2>Audit error details</h2>
        <pre>{{ last_error }}</pre>
      </section>
    {% endif %}

    <p>
      <a href="{{ url_for('receipt') }}">
        Return to receipt
      </a>
    </p>
  </main>
</body>
</html>
